[project]
name = "pyechorobotics"
version = "2.3.0"
dependencies = [
    "aiohttp",
    "yarl",
    "pydantic >= 2.0.0, < 3.0.0",
    "python-dateutil"
]
readme = "README.md"
license = "GPL-3.0-or-later"
description = "Access API for echorobotics robot lawn mowers"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
]
authors = [
    { name = "functionpointer", email = "suspendfunction@gmail.com" },
]

[project.urls]
homepage = "https://github.com/functionpointer/pyechorobotics"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
